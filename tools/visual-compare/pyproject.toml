[project]
name = "visual-compare"
version = "1.0.0"
description = "Deterministic visual fidelity comparison CLI (SSIM + pixel + edge)."
requires-python = ">=3.12"
dependencies = [
    "numpy==2.1.3",
    "pillow==11.0.0",
    "scikit-image==0.24.0",
    "scipy==1.14.1",
]

[project.scripts]
visual-compare = "visual_compare:main"

[project.optional-dependencies]
test = ["pytest==8.3.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["visual_compare.py"]

[tool.hatch.build.targets.wheel.sources]
"visual_compare.py" = "visual_compare.py"
